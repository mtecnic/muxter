[project]
name = "muxter"
version = "0.1.0"
description = "Two-pane terminal-session monitor: browse and mirror this machine's tmux sessions"
requires-python = ">=3.12"
dependencies = [
    "textual==8.2.8",
    "rich==15.0.0",
    "pyte",
    "ptyprocess",
]

[project.scripts]
muxter = "muxter.app:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["muxter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
